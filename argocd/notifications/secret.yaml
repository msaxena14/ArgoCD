# Do NOT commit a real token here. After applying this manifest, set the
# actual value out-of-band, e.g.:
#   kubectl -n argocd patch secret argocd-notifications-secret \
#     --type merge -p '{"stringData":{"slack-token":"<real-token>"}}'
apiVersion: v1
kind: Secret
metadata:
    name: argocd-notifications-secret
type: Opaque
stringData:
    slack-token: REPLACE_ME
